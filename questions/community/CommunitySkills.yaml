# yaml-language-server: $schema=../question.schema.json
question:
  id: CommunitySkills
  version: '2026.1'
  title: Which sources most influence what technical, AI, or professional skills you decide to learn next? Select up to 3.
  type: multi_select
  required: false
  validate:
    type: selection_count
    min: 0
    max: 3
  options:
    - label: Coworkers, classmates, or peers
      short: Coworkers and peers
    - label: Manager or workplace expectations
      short: Workplace expectations
    - label: Online communities or forums
      short: Communities and forums
    - label: Stack Overflow / Stack Exchange
      short: Stack Overflow
    - label: YouTube or video creators
      short: YouTube and video
    - Podcasts
    - Newsletters or blogs
    - Social media
    - label: Courses or certifications
      short: Courses or certs
    - Documentation
    - AI tools or chatbots
    - label: Job postings or labor market signals
      short: Job postings
    - Conferences or events
    - label: I am not currently deciding what to learn next
      short: Not deciding right now
