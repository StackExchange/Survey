# yaml-language-server: $schema=../question.schema.json
question:
  id: AnswersTrust
  version: '2026.1'
  title: What makes you trust the information you find when you are searching for answers? Select your top 3 choices.
  type: multi_select
  required: false
  validate:
    type: selection_count
    min: 0
    max: 3
  options:
    - label: The information was referred to me by a human I trust directly
      short: Referred by someone I trust
    - label: The format and content of the information is well-organized and logical
      short: Well organised and logical
    - label: The format and content of the information is creative and thought-provoking
      short: Creative and thoughtful
    - label: The information has many citations, sources themselves don't matter as much as the ability to track down the origin
      short: Many citations to follow
    - label: I can see user activity associated with the human that posts the information I find
      short: I can see who posted it
    - label: There are many upvotes/likes/shares/views associated with the content
      short: Lots of upvotes or views
    - label: I heard about the source of information before from another trusted source, such as a news site, a social feed, or a podcast interview
      short: Source I'd heard of before
