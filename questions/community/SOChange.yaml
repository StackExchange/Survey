# yaml-language-server: $schema=../question.schema.json
question:
  id: SOChange
  version: '2026.1'
  title: How has AI changed your Stack Overflow usage? Select all that apply.
  type: multi_select
  required: false
  options:
    - Visit less for simple questions
    - label: Visit more for verification (for example, source attribution)
      short: Used to verify
    - Ask fewer questions
    - label: Ask more advanced questions
      short: Ask advanced questions
    - Contribute less
    - Contribute more
    - label: Visit SO more because AI-generated answers lead you there
      short: Visit more via AI
    - Other
    - No change
