# yaml-language-server: $schema=../question.schema.json
question:
  id: SOPartFreq
  version: '2025.1'
  title: How frequently would you say you participate in Q&A on Stack Overflow? By participate we mean ask, answer, and vote or comment on questions.
  type: single_select
  required: false
  options:
    - label: I have never participated in Q&A on Stack Overflow
      short: Never participated
    - label: Infrequently, less than once per year
      short: Less than once a year
    - label: Less than once every 2 - 3 months
      short: Less than every 2–3 months
    - label: Less than once per month or monthly
      short: Monthly or less often
    - label: A few times per month or weekly
      short: Weekly or a few times a month
    - A few times per week
    - Daily or almost daily
    - Multiple times per day
