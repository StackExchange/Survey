# yaml-language-server: $schema=../question.schema.json
question:
  id: AIHuman
  version: '2025.1'
  title: In the future, if AI can do most coding tasks, in which situations would you still want to ask another person for help? Select all that apply.
  type: multi_select
  required: false
  options:
    - label: When I’m stuck and can’t explain the problem
      short: Stuck, can’t explain it
    - label: When I want to fully understand something
      short: To fully understand something
    - label: When I want to learn best practices
      short: Learning best practices
    - label: When I don’t trust AI’s answers
      short: Don’t trust AI’s answers
    - label: When I need help fixing complex or unfamiliar code
      short: Fixing unfamiliar code
    - label: When I need quick help troubleshooting
      short: Quick troubleshooting help
    - label: When I want to compare different solutions
      short: Comparing solutions
    - label: When I have ethical or security concerns about code
      short: Ethical or security concerns
    - label: I don’t think I’ll need help from people anymore
      short: Won’t need people anymore
    - label: Other, please specify
      short: Other
      key: other
      text_entry: true
  deprecated: true
