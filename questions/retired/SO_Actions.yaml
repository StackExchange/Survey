# yaml-language-server: $schema=../question.schema.json
question:
  id: SO_Actions
  version: '2025.1'
  title: When visiting Stack Overflow, which following activities are you most interested in?  Please rank the following so the first activity is what most interests you and last is your least interested activity.
  type: rank
  required: false
  randomize: true
  options:
    - label: Browse content related to Q&A posts I recently viewed
      short: Browse related content
    - label: Read and/or vote on comments for a Question or Answer I am interested in
      short: Read or vote on comments
    - label: Bookmark posts to look at later
      short: Bookmark posts for later
    - label: Directly open a Q&A post via search, documentation or a peer
      short: Open a Q&A post directly
    - Ask a question
    - Answer a question
    - Comment on Q&A posts
    - Upvote/Downvote Q&A posts
    - Use discussion or chat feature
    - label: Other, please specify
      short: Other
      key: other
      text_entry: true
  deprecated: true
