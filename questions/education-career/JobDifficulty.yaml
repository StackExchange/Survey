# yaml-language-server: $schema=../question.schema.json
question:
  id: JobDifficulty
  version: '2026.1'
  title: In the past 6 months, which factor has done the most to make your job harder to do?
  type: single_select
  required: false
  randomize: true
  options:
    - label: Unclear priorities or requirements
      short: Unclear priorities
    - label: Lack of access to the right tools or platforms
      short: No tool access
    - label: Unreliable systems, infrastructure, or environments
      short: Unreliable systems
    - label: Poor documentation or knowledge sharing
      short: Poor documentation
    - label: Lack of support from teammates, managers, or mentors
      short: No support
    - label: Not enough time, staffing, or resources
      short: Not enough time
    - label: Inefficient processes, workflows, or coordination
      short: Inefficient processes
    - label: Leadership activity or organizational changes
      short: Leadership/org changes
    - label: Nothing has made my job harder in the past 6 months
      short: Nothing made it harder
    - label: I’m not sure
      short: Not sure
    - label: Other, please specify
      short: Other
      key: other
      text_entry: true
