# yaml-language-server: $schema=../question.schema.json
question:
  id: EmploymentAddl
  version: '2026.1'
  title: Which of the following other current work, school, or life responsibilities are you currently engaged in?
  type: multi_select
  required: false
  options:
    - Attending school (full-time)
    - Attending school (part-time)
    - label: Engaged in paid work (less than 10 hours per week)
      short: Paid work, under 10 hrs
      key: hrs_under_10
    - label: Engaged in paid work (10-19 hours per week)
      short: Paid work, 10–19 hrs
      key: hrs_10_19
    - label: Engaged in paid work (20-29 hours per week)
      short: Paid work, 20–29 hrs
      key: hrs_20_29
    - label: Transitioning to retirement (gradually reducing work hours)
      short: Transitioning to retirement
    - Volunteering (regularly)
    - label: Caring for dependents (children, elderly, etc.)
      short: Caring for dependents
    - None of the above
