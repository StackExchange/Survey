# yaml-language-server: $schema=../question.schema.json
question:
  id: JobEase
  version: '2026.1'
  title: In the past 6 months, which factor has done the most to make your job easier to do?
  type: single_select
  required: false
  randomize: true
  options:
    - label: Clear priorities or requirements
      short: Clear priorities
    - label: Access to the right tools or platforms
      short: The right tools
    - label: Reliable systems, infrastructure, or environments
      short: Reliable systems
    - label: Helpful documentation or knowledge sharing
      short: Helpful documentation
    - label: Supportive teammates, managers, or mentors
      short: Supportive teammates
    - label: Enough time, staffing, or resources
      short: Enough time and staffing
    - label: Leadership activity or organizational changes
      short: Leadership or org changes
    - label: Better processes, workflows, or coordination
      short: Better processes
    - label: Nothing has made my job easier in the past 6 months
      short: Nothing made it easier
    - I’m not sure
    - label: Other, please specify
      short: Other
      key: other
      text_entry: true
