# yaml-language-server: $schema=../question.schema.json
question:
  id: WorkSetting
  version: '2026.1'
  title: Which best describes your current work situation?
  type: single_select
  required: false
  options:
    - Remote
    - In-person
    - label: Hybrid (some remote, leans heavy to in-person)
      short: Hybrid, mostly in-person
    - label: Hybrid (some in-person, leans heavy to flexibility)
      short: Hybrid, mostly remote
    - label: Your choice (very flexible, you can come in when you want or just as needed)
      short: Your choice, fully flexible
