# yaml-language-server: $schema=../question.schema.json
question:
  id: LearnCodeHow
  version: '2026.1'
  title: How did you learn to code in the past year? Select all that apply.
  type: multi_select
  required: false
  randomize: true
  options:
    - Books / physical media
    - Technical documentation (is generated for/by the tool or system)
    - Coding bootcamp
    - Colleague or on-the-job training
    - Games or coding challenges
    - Online courses or certification
    - AI (codegen tools or chat apps)
    - Blogs or podcasts
    - Videos (i.e. Youtube)
    - Other online resources (e.g. standard search, forum, online community)
    - School (i.e., university, college, etc)
    - Stack Overflow or Stack Exchange
    - Reviewing GitHub projects or existing code repositories
    - label: Other, please specify
      key: other
      text_entry: true
