# yaml-language-server: $schema=../question.schema.json
question:
  id: LearnCodeHow
  version: '2026.1'
  title: How did you learn to code in the past year? Select all that apply.
  type: multi_select
  required: false
  randomize: true
  options:
    - Books / physical media
    - label: Technical documentation (is generated for/by the tool or system)
      short: Technical documentation
    - Coding bootcamp
    - label: Colleague or on-the-job training
      short: Colleague or on-the-job
    - Games or coding challenges
    - Online courses or certification (includes all media types)
    - AI codegen tools or AI-enabled apps
    - Blogs or podcasts
    - label: Videos (not associated with specific online course or certification)
      short: Videos
    - label: Other online resources (e.g. standard search, forum, online community)
      short: Other online resources
    - School (i.e., university, college, etc)
    - label: Stack Overflow or Stack Exchange
      short: Stack Overflow or Exchange
    - label: Other, please specify
      key: other
      text_entry: true
