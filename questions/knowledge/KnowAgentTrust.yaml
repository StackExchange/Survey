# yaml-language-server: $schema=../question.schema.json
question:
  id: KnowAgentTrust
  version: '2026.1'
  title: When using AI tools or agents for work, how much control do you usually have over the work information they use?
  type: single_select
  required: false
  options:
    - label: I decide exactly what information to give the AI tool
      short: I decide exactly
    - label: I choose from available sources, files, or systems
      short: I pick from what's there
    - label: The AI tool chooses the information automatically
      short: The tool chooses
    - label: Someone else manages what information the AI tool can access
      short: Someone else manages it
    - label: I am not sure what information the AI tool uses
      short: Not sure what it uses
    - label: I do not use AI tools or agents for work
      short: Don't use AI for work
