# yaml-language-server: $schema=../question.schema.json
question:
  id: ContextSelect
  version: '2026.1'
  title: When working on a project or task, which types of context are most important for you to have? Select up to 5.
  type: multi_select
  required: false
  validate:
    type: selection_count
    min: 0
    max: 5
  options:
    - label: Project goals or requirements
      short: Project goals
    - label: Prior decisions and rationale
      short: Prior decisions
    - label: Current status or ownership
      short: Status or ownership
    - label: Related tickets, tasks, or issues
      short: Related tickets
    - label: Code, repositories, or technical documentation
      short: Code and documentation
    - label: Pull requests, commit history, or release notes
      short: Pull requests and history
    - label: Customer or user feedback
      short: User feedback
    - label: Business goals or product strategy
      short: Business goals
    - label: Compliance, security, or policy requirements
      short: Compliance and policy
    - label: Team norms, preferences, or ways of working
      short: Team ways of working
    - label: Past discussions in chat, email, or meetings
      short: Past discussions
    - label: Data, dashboards, or reports
      short: Data and dashboards
    - label: I do not usually need additional context
      short: Don't need more context
    - label: Other, please specify
      key: other
      text_entry: true
