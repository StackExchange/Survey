      short: Elastic
    - Glean
    - label: Google Cloud Search / Vertex AI Search
      short: Google / Vertex AI Search
    - IBM Watson Discovery
    - Lucidworks
    - Microsoft Search
    - MongoDB Atlas Search
    - OpenSearch
    - label: Salesforce Einstein Search
      short: Einstein Search
    - SearchStax
    - ServiceNow AI Search
