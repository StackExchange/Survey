# yaml-language-server: $schema=../question.schema.json
question:
  id: AITrust
  version: '2026.1'
  title: How much do you trust the output from AI tools or AI agents as part of your workflow?
  type: single_select
  required: false
  options:
    - label: I do not trust it for most work tasks
      short: Don't trust it for most
    - label: I trust it for low-risk work tasks only
      short: Low-risk tasks only
    - label: I trust it when I can easily verify the output
      short: When I can verify it
    - label: I trust it for many tasks, but not important work decisions
      short: Many tasks, not decisions
    - label: I trust it for many tasks, including important work decisions
      short: Many tasks and decisions
    - label: Not sure / I do not use AI tools
      short: Not sure or don't use AI
