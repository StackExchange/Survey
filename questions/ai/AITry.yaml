# yaml-language-server: $schema=../question.schema.json
question:
  id: AITry
  version: '2026.1'
  title: Which of the following best describes how your organization currently approaches AI tools or models?
  type: single_select
  required: false
  options:
    - label: We mostly use one approved tool or model
      short: Mostly one approved tool
    - label: We use a few approved tools or models
      short: A few approved tools
    - label: Different teams choose their own tools or models
      short: Teams choose their own
    - label: We are trying multiple tools or models before deciding what to use longer-term
      short: Trying several before deciding
    - label: We are building internal tools or models
      short: Building internally
    - label: We are not using AI tools or models in a meaningful way
      short: Not really using AI
    - Not sure
