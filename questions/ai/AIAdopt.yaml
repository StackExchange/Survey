# yaml-language-server: $schema=../question.schema.json
question:
  id: AIAdopt
  version: '2026.1'
  title: When you or your organization decides whether to adopt, continue using, or expand use of an AI tool or model for your work, which factors matter most? Select up to 3.
  type: multi_select
  required: false
  randomize: true
  validate:
    type: selection_count
    min: 0
    max: 3
  options:
    - label: The tool produces useful and accurate results
      short: Useful, accurate results
    - label: The tool works well with how people already do their jobs
      short: Fits how people work
    - label: The tool meets security, privacy requirements
      short: Meets security and privacy
    - label: The tool meets legal or compliance requirements
      short: Meets legal and compliance
    - label: The price is acceptable for the value it provides
      short: Price matches the value
    - label: The tool is worth paying more for because of better results
      short: Worth paying more for
    - label: Usage and spending are easy to monitor or limit
      short: Spending is easy to limit
    - label: The tool connects with systems people already use
      short: Connects to existing systems
    - label: The organization can switch tools or models without major disruption
      short: Can switch without disruption
    - label: Employees or teams are asking to use it
      short: Teams are asking for it
    - label: There is evidence that the tool improves business outcomes
      short: Evidence of better outcomes
    - label: The tool reduces time spent correcting, retrying, or reworking outputs
      short: Less reworking of outputs
    - label: The tool has observability already integrated or built in
      short: Observability is built in
    - Review burden is low
    - label: Human oversight is manageable
      short: Oversight is manageable
    - label: Your company policy allows for usage
      short: Company policy allows it
    - Not sure
    - label: Other, please specify
      key: other
      text_entry: true
