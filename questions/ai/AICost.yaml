  version: '2026.1'
  title: Has cost or usage limits ever changed how you personally use AI tools at work?
  type: multi_select
  required: false
  options:
    - label: Yes, usage is metered to manage costs
      short: Usage is metered
    - label: Yes, I personally monitor my own use
      short: I monitor my own use
    - label: Yes, I choose cheaper models when possible
      short: I choose cheaper models
    - label: Yes, I choose faster models even when they cost more
      short: Faster models, higher cost
    - label: Yes, my company/team has switched models/vendors that are more affordable
      short: Switched to cheaper vendors
    - label: Yes, I am more selective about tasks
      short: More selective about tasks
    - label: No, cost/limits have not affected my usage
      short: No, cost hasn't affected me
    - label: My company/team has increased budget for AI
      short: Budget was increased
    - label: I have not encountered cost or usage limits
      short: Haven't hit any limits
    - Not sure
