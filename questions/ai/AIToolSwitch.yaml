# yaml-language-server: $schema=../question.schema.json
question:
  id: AIToolSwitch
  version: '2026.1'
  title: In the past year, have you switched from one AI tool to another for work? If yes, what was the primary reason?
  type: single_select
  required: false
  options:
    - No
    - label: Yes — better output quality
      short: Better output quality
    - Yes — lower cost
    - label: Yes — better integration with my workflow or development environment
      short: Better integration
    - label: Yes — better security, privacy, or compliance
      short: Better security or privacy
    - label: Yes — my organization required or recommended a different tool
      short: My organization required it
    - label: Yes — for a specific feature
      short: For a specific feature
    - label: Yes — better support for agents, automation, or coding workflows
      short: Better agent support
    - label: Yes — access to a preferred model or provider
      short: A preferred model
    - label: Yes — the previous tool became too expensive, limited, or unavailable
      short: The old tool got too costly
    - label: Yes — another reason (write in)
      short: Another reason
      key: other
      text_entry: true
    - label: Not applicable — I do not use AI tools for work
      short: Don't use AI for work
