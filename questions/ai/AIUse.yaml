# yaml-language-server: $schema=../question.schema.json
question:
  id: AIUse
  version: '2026.1'
  title: Which of the following best describes how AI tools or agents are used at your organization today?
  type: single_select
  required: false
  options:
    - label: AI use is mostly optional and left up to individuals
      short: Optional, up to individuals
    - label: Some teams actively encourage AI use, but practices vary across the organization
      short: Encouraged, but varies
    - label: My organization provides approved AI tools and guidance for how to use them
      short: Approved tools and guidance
    - label: My organization expects some employees to use AI tools for certain types of work
      short: Expected for certain work
    - label: My organization measures or evaluates AI use as part of employee or team performance
      short: Measured in performance
    - label: My organization does not currently use AI tools or agents for work
      short: We don't use AI at work
    - Not sure
