# yaml-language-server: $schema=../question.schema.json
question:
  id: AIAvoid
  version: '2026.1'
  title: Do you try to avoid using AI tools or agents at work or school? Select the option below that most accurately reflects your reasoning.
  type: single_select
  required: false
  options:
    - Environmental concerns
    - label: Concern over losing job skills or training an AI to replace you
      short: Losing skills to AI
    - label: Issues with privacy or security
      short: Privacy or security
    - label: Moral or ethical concerns
      short: Morals/ethics
    - label: Difficulty or lack of training
      short: Lack of training
    - label: I do not avoid using AI at work or school
      short: I don't avoid AI
    - label: 'Other, please specify:'
      key: other
      text_entry: true
